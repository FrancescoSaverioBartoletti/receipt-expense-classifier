[project]
name = "receipt-expense-classifier"
version = "0.1.0"
description = "Expense classifier from receipt photos (crop, extract, classify)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pycocotools>=2.0.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_classifier"]

# RTX 5070 (Blackwell, sm_120) needs CUDA 12.8+ builds of PyTorch.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
